<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/style.css">
<title>AI English 4-in-1</title>
</head>
<body>
<header>
  <div><small>AI ENGLISH</small><h1 id="pageTitle">4-in-1 Trainer</h1></div>
  <button id="settings">⚙︎</button>
</header>
<main id="view"></main>
<nav>
  <button data-mode="home" class="active">⌂<span>ホーム</span></button>
  <button data-mode="phrase">▤<span>フレーズ</span></button>
  <button data-mode="mission">◎<span>会話</span></button>
  <button data-mode="listening">◉<span>聞く</span></button>
  <button data-mode="fluency">↗<span>話す</span></button>
</nav>

<dialog id="dlg">
  <form method="dialog">
    <div class="handle"></div>
    <h2>設定</h2>
    <label>モデル</label>
    <select id="model">
      <option value="gpt-5.4-mini">gpt-5.4-mini（おすすめ）</option>
      <option value="gpt-5.4-nano">gpt-5.4-nano（低コスト）</option>
      <option value="gpt-5.6-luna">gpt-5.6-luna（高性能）</option>
    </select>
    <p class="note">APIキーはスマホ側には保存せず、サーバー側だけで管理します。</p>
    <button class="primary wide" value="close" onclick="saveSettings()">保存</button>
  </form>
</dialog>
<script src="/app.js"></script>
</body>
</html>
