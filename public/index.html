<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<link rel="stylesheet" href="/style.css">
<title>AI English Realtime</title>
</head>
<body>
<header>
  <div><small>AI ENGLISH 4-in-1</small><h1>Realtime Mission</h1></div>
  <div id="statusDot" class="dot"></div>
</header>

<main>
  <section class="hero">
    <div class="kicker">MISSION 03</div>
    <h2>ホテル・チェックイン</h2>
    <p>開始したら、あとは普通に話してください。AIが話している途中でも割り込めます。</p>
  </section>

  <section class="card">
    <div class="missions">
      <div>□ 予約していることを伝える</div>
      <div>□ 朝食の時間を聞く</div>
      <div>□ チェックアウト時間を聞く</div>
    </div>
  </section>

  <section class="voice-stage">
    <div id="orb" class="orb idle"><div class="orb-core"></div><div class="orb-ring"></div></div>
    <div id="stateText" class="state-text">タップして会話を開始</div>
    <div id="subText" class="sub-text">開始後はトークボタン不要です</div>
    <button id="mainButton" class="main-button">会話を開始</button>
    <button id="endButton" class="end-button hidden">終了</button>
  </section>

  <section class="card compact">
    <b>声だけで操作できます</b>
    <div class="commands">
      <span>“Speak slower”</span><span>“Faster”</span><span>“Stop”</span><span>“Say that again”</span>
    </div>
  </section>

  <section class="card compact">
    <div class="row"><b>接続状態</b><span id="connection">未接続</span></div>
    <div id="lastEvent" class="tiny">—</div>
  </section>
</main>

<audio id="remoteAudio" autoplay playsinline></audio>
<script src="/app.js"></script>
</body>
</html>
